<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehicle — Rawalpindi K LTD</title>
  <meta name="theme-color" content="#070707" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page-car">

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo10-sm.png" alt="" onerror="this.remove()" />
        <span class="nb-text"><b data-brand>Rawalpindi</b><i data-brand-sub>K LTD</i></span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#inventory">Inventory</a>
        <a href="index.html#contact">Contact</a>
        <a href="index.html#contact" class="btn btn-red btn-sm" data-enquire>Enquire</a>
      </nav>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span></button>
    </div>
  </header>

  <main class="container car-page" id="car">
    <a href="index.html#inventory" class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to inventory
    </a>
    <div class="car-layout">
      <div class="gallery skeleton-block"></div>
      <div class="car-info skeleton-block"></div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
    <img alt="" />
    <button class="lb-nav lb-next" aria-label="Next">›</button>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <img class="footer-logo" src="assets/logo10-sm.png" alt="Rawalpindi K LTD" onerror="this.remove()" />
      <span class="nb-text"><b data-brand>Rawalpindi</b><i data-brand-sub>K LTD</i></span>
      <span class="muted">© <span data-year></span> <span data-brand></span>. All rights reserved.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/car.js"></script>
</body>
</html>
