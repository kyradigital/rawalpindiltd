<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rawalpindi K LTD — Quality Cars</title>
  <meta name="description" content="Browse our latest inventory of quality, hand-picked vehicles." />
  <meta name="theme-color" content="#070707" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="is-loading">

  <!-- Loading screen -->
  <div id="loader" aria-hidden="true">
    <div class="loader-inner">
      <img class="loader-logo" src="assets/logo10-sm.png" alt="" onload="this.closest('#loader').classList.add('has-logo')" onerror="this.remove()" />
      <div class="wordmark">
        <span class="wm-main" data-brand>Rawalpindi</span>
        <span class="wm-sub" data-brand-sub>K LTD</span>
      </div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <!-- Nav -->
  <header class="nav">
    <div class="nav-inner">
      <a href="#top" class="nav-brand">
        <img src="assets/logo10-sm.png" alt="" onerror="this.remove()" />
        <span class="nb-text"><b data-brand>Rawalpindi</b><i data-brand-sub>K LTD</i></span>
      </a>
      <nav class="nav-links">
        <a href="#top">Home</a>
        <a href="#inventory">Inventory</a>
        <a href="#contact">Contact</a>
        <a href="#contact" class="btn btn-red btn-sm" data-enquire>Enquire</a>
      </nav>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span></button>
    </div>
  </header>

  <!-- Banner -->
  <section class="hero" id="top">
    <picture>
      <source media="(max-width: 760px)" srcset="assets/banner-mobile.jpg" />
      <img class="hero-img" src="assets/banner10.jpg" alt="" onerror="this.closest('.hero').classList.add('no-img'); this.closest('picture').remove()" />
    </picture>
    <div class="hero-shade"></div>
  </section>

  <!-- Search filter -->
  <section class="finder-wrap">
    <div class="container">
      <form class="finder" id="finder">
        <label class="f-field">
          <span class="f-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
          <span class="f-txt"><small>Make</small><select id="f-make"><option value="">Any make</option></select></span>
        </label>
        <label class="f-field">
          <span class="f-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v3a1 1 0 0 1-1 1h-1M5 17H4a1 1 0 0 1-1-1"/><path d="M3 13h18M9 17h6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></span>
          <span class="f-txt"><small>Model</small><select id="f-model"><option value="">Any model</option></select></span>
        </label>
        <label class="f-field">
          <span class="f-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
          <span class="f-txt"><small>Year</small><select id="f-year"><option value="">Any year</option></select></span>
        </label>
        <label class="f-field">
          <span class="f-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg></span>
          <span class="f-txt"><small>Colour</small><select id="f-color"><option value="">Any colour</option></select></span>
        </label>
        <label class="f-field">
          <span class="f-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h2l2-3h6l2 3h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2l-2 2H8l-2-2H4z"/><path d="M9 7V5h6v2"/></svg></span>
          <span class="f-txt"><small>Engine size</small><select id="f-engine"><option value="">Any size</option></select></span>
        </label>
        <button type="submit" class="btn btn-red f-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          Search
        </button>
      </form>
      <button type="button" class="f-clear" id="f-clear" hidden>Clear filters ×</button>
    </div>
  </section>

  <!-- Brands -->
  <section class="brands-wrap">
    <div class="container brands" id="brands">
      <button type="button" class="brand" data-make="mercedes" aria-label="Mercedes-Benz"><i><img src="assets/brands/mercedes.svg" alt="" width="40" height="40" /></i><span>Mercedes</span></button>
      <button type="button" class="brand" data-make="porsche" aria-label="Porsche"><i><img src="assets/brands/porsche.svg" alt="" width="40" height="40" /></i><span>Porsche</span></button>
      <button type="button" class="brand" data-make="volvo" aria-label="Volvo"><i><img src="assets/brands/volvo.svg" alt="" width="40" height="40" /></i><span>Volvo</span></button>
      <button type="button" class="brand" data-make="subaru" aria-label="Subaru"><i><img src="assets/brands/subaru.svg" alt="" width="40" height="40" /></i><span>Subaru</span></button>
      <button type="button" class="brand brand-m5" data-make="toyota" aria-label="Toyota"><i><img src="assets/brands/toyota.svg" alt="" width="40" height="40" /></i><span>Toyota</span></button>
      <button type="button" class="brand brand-more" data-make="lexus" aria-label="Lexus"><i><img src="assets/brands/lexus.svg" alt="" width="40" height="40" /></i><span>Lexus</span></button>
      <button type="button" class="brand brand-more" data-make="land rover|range rover|landrover" aria-label="Land Rover"><i><img src="assets/brands/landrover.svg" alt="" width="40" height="40" /></i><span>Land Rover</span></button>
      <button type="button" class="brand brand-more" data-make="bmw" aria-label="BMW"><i><img src="assets/brands/bmw.svg" alt="" width="40" height="40" /></i><span>BMW</span></button>
      <button type="button" class="brand brand-more" data-make="audi" aria-label="Audi"><i><img src="assets/brands/audi.svg" alt="" width="40" height="40" /></i><span>Audi</span></button>
      <button type="button" class="brand brand-more" data-make="nissan" aria-label="Nissan"><i><img src="assets/brands/nissan.svg" alt="" width="40" height="40" /></i><span>Nissan</span></button>
    </div>
  </section>

  <!-- Inventory -->
  <main class="section" id="inventory">
    <div class="container">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow">Showroom</span>
          <h2 class="section-title">Our Inventory</h2>
        </div>
        <span class="count" id="car-count"></span>
      </div>

      <div class="toolbar reveal">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search make, model, year…" autocomplete="off" />
        </div>
        <div class="chips" id="chips"></div>
        <select id="sort" aria-label="Sort">
          <option value="new">Newest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="year-desc">Year: newest</option>
          <option value="km-asc">Mileage: lowest</option>
        </select>
      </div>

      <div class="grid" id="grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <p class="empty" id="empty" hidden>No cars match your search.</p>
    </div>
  </main>

  <!-- Contact -->
  <section class="section contact" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow">Get in touch</span>
          <h2 class="section-title">Visit the showroom</h2>
        </div>
      </div>
      <div class="contact-list" id="contact-list"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <img class="footer-logo" src="assets/logo10-sm.png" alt="Rawalpindi K LTD" onerror="this.remove()" />
      <span class="nb-text"><b data-brand>Rawalpindi</b><i data-brand-sub>K LTD</i></span>
      <span class="muted">© <span data-year></span> <span data-brand></span>. All rights reserved.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
